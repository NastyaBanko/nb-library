<div class="nb-library__container">
  <nb-menu [activeItemId]="_menuItemId()" (itemClick)="_onMenuSelect($event)"></nb-menu>

  <nb-tabs
    class="nb-library__tabs"
    [tabs]="_mainTabs"
    [activeTabId]="_currentTab()"
    (tabChange)="_onTabSelect($event)"
  >
    <nb-highchart-page
      *ngIf="_menuItemId() === _menuItemIds.HIGHCHARTS"
      class="taHighchartPage"
      [tabId]="_currentTab()"
    ></nb-highchart-page>
    <nb-card-page
      *ngIf="_menuItemId() === _menuItemIds.CARDS"
      class="taCardPage"
      [tabId]="_currentTab()"
    ></nb-card-page>
    <nb-api-page
      *ngIf="_currentTab() === _tabsId.OVERVIEW && _menuItemId() === _menuItemIds.API"
      class="taApiPage"
    ></nb-api-page>
  </nb-tabs>
</div>
