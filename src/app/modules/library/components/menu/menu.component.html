<aside class="sidebar">
  <!-- Шапка -->
  <div class="sidebar-header">
    <div class="logo">A</div>
    <span class="logo-text">AppWorkspace</span>
  </div>

  <!-- Поиск -->
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        ></path>
      </svg>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Поиск по меню..." />
    </div>
  </div>

  <!-- Список элементов -->
  <div class="menu-list">
    <div *ngIf="filteredItems.length === 0" class="no-results">Ничего не найдено</div>

    <button
      *ngFor="let item of filteredItems"
      (click)="selectItem(item)"
      [class.active]="activeId === item.id"
      class="menu-item"
    >
      <div class="menu-item-content">
        <span [innerHTML]="item.icon" class="icon"></span>
        <span>{{ item.label }}</span>
      </div>
      <span *ngIf="item.badge" class="badge">{{ item.badge }}</span>
    </button>
  </div>

  <!-- Футер профиля -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar">ДП</div>
      <div class="user-info">
        <span class="user-name">Дмитрий П.</span>
        <span class="user-email">admin&#64;workspace.io</span>
      </div>
    </div>
  </div>
</aside>
