<form class="nb-dynamic-form__dynamic-form" [formGroup]="form">
  <div *ngFor="let field of fields" class="nb-dynamic-form__form-group">
    <label [for]="field.key">{{ field.label | translate }}</label>

    <ng-container [ngSwitch]="field.type">
      <input
        *ngSwitchCase="fieldType.TEXT"
        class="nb-dynamic-form__form-control"
        type="text"
        [id]="field.key"
        [type]="field.type"
        [formControlName]="field.key"
      />

      <div *ngSwitchCase="fieldType.SELECT" class="nb-dynamic-form__select-wrapper">
        <select
          class="nb-dynamic-form__form-control nb-dynamic-form__select-control"
          [id]="field.key"
          [formControlName]="field.key"
        >
          <option
            *ngFor="let opt of field.options"
            class="nb-dynamic-form__select-option"
            [value]="opt.value"
          >
            {{ opt.label }}
          </option>
        </select>
        <nb-icon class="nb-dynamic-form__select-arrow" name="arrow-down"></nb-icon>
      </div>

      <div *ngSwitchCase="fieldType.COLOR" class="nb-dynamic-form__color-picker-wrapper">
        <input
          class="nb-dynamic-form__color-input"
          type="color"
          [id]="field.key"
          [formControlName]="field.key"
        />
        <span class="nb-dynamic-form__color-value">{{ form.get(field.key)?.value }}</span>
      </div>

      <ng-container *ngSwitchCase="fieldType.MEMO">
        <textarea
          class="nb-dynamic-form__form-control nb-dynamic-form__memo-control"
          rows="10"
          [id]="field.key"
          [formControlName]="field.key"
        ></textarea>

        <div *ngIf="_isFieldInvalid(field.key)" class="nb-dynamic-form__error-msg">
          {{ "label.wrong.data" | translate }}
        </div>
      </ng-container>
    </ng-container>
  </div>
</form>
