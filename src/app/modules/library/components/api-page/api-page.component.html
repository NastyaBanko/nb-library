<div class="nb-api-page">
  <h3 class="nb-api-page__title">{{ "title.api.page" | translate }}</h3>
  <p class="nb-api-page__subtitle">{{ "label.api.page" | translate }}</p>

  <div *ngIf="isLoading()" class="nb-api-page__loader-container">
    <nb-loader mode="inline"></nb-loader>
  </div>
  <div *ngIf="!isLoading() && errorMessage()" class="nb-api-page__error">
    {{ errorMessage() }}
  </div>

  <ng-container *ngIf="users$ | async as users">
    <ul *ngIf="!isLoading() && !errorMessage()" class="nb-api-page__list">
      <li *ngFor="let user of users; trackBy: _trackById" class="nb-api-page__item">
        <span class="nb-api-page__name">{{ user.name }}</span>
        <span class="nb-api-page__email">{{ user.email }}</span>
        <span class="nb-api-page__company">{{ user.company.name }}</span>
      </li>
    </ul>
  </ng-container>
</div>
